<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">EARTHLING</title>
  <desc id="desc">The EARTHLING globe on an onyx tile.</desc>
  <defs>
    <radialGradient id="ocean" cx=".34" cy=".26" r=".95">
      <stop stop-color="#B49BFF"/>
      <stop offset=".42" stop-color="#6C3BFF"/>
      <stop offset="1" stop-color="#1E0A66"/>
    </radialGradient>
    <linearGradient id="land" x1="15" y1="12" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FFE6"/>
      <stop offset=".45" stop-color="#3DF2B5"/>
      <stop offset="1" stop-color="#14B886"/>
    </linearGradient>
    <radialGradient id="shade" cx=".5" cy=".5" r=".5">
      <stop offset=".6" stop-color="#0A0A10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0A10" stop-opacity=".45"/>
    </radialGradient>
    <linearGradient id="ring" x1="-2" y1="30" x2="62" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FF"/>
      <stop offset="1" stop-color="#3DF2B5"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7DFFD6"/>
      <stop offset="1" stop-color="#2EE6A6"/>
    </linearGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="tile" cx=".25" cy=".1" r=".9"><stop stop-color="#6C3BFF" stop-opacity=".35"/><stop offset="1" stop-color="#6C3BFF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0A0A10"/>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <g transform="translate(32 33) scale(.84) translate(-30 -30)">
    <path d="M-1.5 30A31.5 12.2 0 0 1 61.5 30" transform="rotate(-18 30 30)" fill="none" stroke="url(#ring)" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="30" cy="30" r="23.5" fill="url(#ocean)"/>
    <path d="M8.5 30h43M30 6.5c-8.1 7.1-12.2 15-12.2 23.5S21.9 46.4 30 53.5M30 6.5C38.1 13.6 42.2 21.5 42.2 30S38.1 46.4 30 53.5" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="1"/>
    <path d="M14.8 18.7l5.7-5.2 7.1 1.5 2.7 4.2-3.3 3.2-4.9.7-1.5 4.5-5.6.6-3.1-4.3 2.9-5.2Zm18.5 9 4.7-4 7.4 1.2 3.1 5.2-3.4 4.3-1.1 7.2-5.7 4.5-4.1-2.2 1.4-5.7-3.8-4.4 1.5-6.1ZM19.5 34.1l5.2.9 3.2 4.5-1.2 8.1-4.9 2.4-3.6-5.3-2.1-6.2 3.4-4.4Z" fill="url(#land)"/>
    <circle cx="30" cy="30" r="23.5" fill="url(#shade)"/>
    <circle cx="30" cy="30" r="23" fill="none" stroke="#C4B5FF" stroke-opacity=".55" stroke-width="1"/>
    <path d="M-1.5 30A31.5 12.2 0 0 0 61.5 30" transform="rotate(-18 30 30)" fill="none" stroke="url(#ring)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="54.1" cy="15.8" r="3" fill="#3DF2B5" filter="url(#glow)"/>
  </g>
