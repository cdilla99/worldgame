<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 64" role="img" aria-labelledby="title desc">
  <title id="title">GeoWars</title>
  <desc id="desc">A globe in a targeting orbit beside the GeoWars wordmark.</desc>
  <defs>
    <linearGradient id="ocean" x1="8" y1="5" x2="50" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78B8FF"/>
      <stop offset=".48" stop-color="#2C72CE"/>
      <stop offset="1" stop-color="#0B2D61"/>
    </linearGradient>
    <linearGradient id="land" x1="15" y1="12" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8FFE8"/>
      <stop offset=".42" stop-color="#63E4A9"/>
      <stop offset="1" stop-color="#25A677"/>
    </linearGradient>
    <linearGradient id="word" x1="71" y1="10" x2="251" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#EDF5FF"/>
      <stop offset=".53" stop-color="#8FF2C5"/>
      <stop offset="1" stop-color="#43DC9E"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(2 2)">
    <circle cx="30" cy="30" r="23.5" fill="url(#ocean)" stroke="#A9D2FF" stroke-width="1.5"/>
    <path d="M8.5 30h43M30 6.5c-8.1 7.1-12.2 15-12.2 23.5S21.9 46.4 30 53.5M30 6.5C38.1 13.6 42.2 21.5 42.2 30S38.1 46.4 30 53.5" fill="none" stroke="#C9E4FF" stroke-opacity=".36" stroke-width="1"/>
    <path d="M14.8 18.7l5.7-5.2 7.1 1.5 2.7 4.2-3.3 3.2-4.9.7-1.5 4.5-5.6.6-3.1-4.3 2.9-5.2Zm18.5 9 4.7-4 7.4 1.2 3.1 5.2-3.4 4.3-1.1 7.2-5.7 4.5-4.1-2.2 1.4-5.7-3.8-4.4 1.5-6.1ZM19.5 34.1l5.2.9 3.2 4.5-1.2 8.1-4.9 2.4-3.6-5.3-2.1-6.2 3.4-4.4Z" fill="url(#land)"/>
    <ellipse cx="30" cy="30" rx="31.5" ry="12.2" fill="none" stroke="#78B8FF" stroke-width="1.25" transform="rotate(-18 30 30)" opacity=".72"/>
    <path d="M50.6 13.5l1.4 5.9 5.8-1.6" fill="none" stroke="#FF6458" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="54.2" cy="16.8" r="2.6" fill="#FF6458"/>
  </g>

  <text x="72" y="40" fill="url(#word)" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-1.8">GEOWARS</text>
  <path d="M73 48h176" stroke="#48617E" stroke-width="1"/>
  <text x="73" y="58" fill="#8FA4BF" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2.25">WORLD SHAPE ARENA</text>
</svg>
